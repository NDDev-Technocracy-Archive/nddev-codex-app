name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6cf64d17c08dfc75392c55784b872fe9a6056553 # v0.6.57
    with:
      hosted-runner: ubuntu-24.04
      fetch-depth: 0
      python-version: '3.15.2'
      tools: actionlint@1.7.12,zizmor@1.32.0,gitleaks@8.30.1,shellcheck@0.11.0

  gate:
    needs: [check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared check to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
